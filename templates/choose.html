{% extends "base.html" %}

{% block content %}
  <!-- Page heading and demo note -->
  <h1>Choose a demo person</h1>
  <p class="note">Demo mode. Sample data.</p>

  <!-- One large card per person; tapping it picks that person -->
  <div class="person-list">
    {% for p in people %}
      <a class="person-card" href="{{ url_for('choose_person', person_id=p.id) }}">
        <span class="initials" aria-hidden="true">{{ p.first_name[0] }}{{ p.last_name[0] }}</span>
        <span class="person-name">{{ p.first_name }} {{ p.last_name }}</span>
      </a>
    {% endfor %}
  </div>
{% endblock %}
