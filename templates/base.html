<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} · Pace</title>

  <!-- Fonts: Atkinson Hyperlegible for body text, Lexend for headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;700&display=swap">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-theme="{{ theme }}">
  <!-- Navigation: a top bar on wide screens, a bottom bar on phones -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('today') }}">Pace</a>
      <nav class="main-nav" aria-label="Main">
        <!-- Today link (sun icon) -->
        <a href="{{ url_for('today') }}" {% if request.endpoint == 'today' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span>Today</span>
        </a>
        <!-- Check in link (check mark icon) -->
        <a href="{{ url_for('checkin') }}" {% if request.endpoint == 'checkin' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
          <span>Check in</span>
        </a>
        <!-- Circle link (two people icon) -->
        <a href="{{ url_for('circle') }}" {% if request.endpoint == 'circle' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 14.5c2.8 0 5 2.2 5 5.5"/></svg>
          <span>Circle</span>
        </a>
        <!-- Me link (person icon) -->
        <a href="{{ url_for('me') }}" {% if request.endpoint in ['me', 'body', 'settings'] %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
          <span>Me</span>
        </a>
      </nav>

      <!-- Theme switcher (laptop top bar only) -->
      <nav class="theme-switcher desktop-only" aria-label="Theme">
        {% for t in themes %}
          <a href="{{ url_for('set_theme', name=t) }}" {% if t == theme %}aria-current="true"{% endif %}>{{ t | capitalize }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <!-- Page content: each screen fills this in (Today adds the "dashboard" class for laptops) -->
  <main class="{% block main_class %}{% endblock %}">
    <!-- Short messages after an action, e.g. "Check in saved" -->
    {% for message in get_flashed_messages() %}
      <p class="flash" role="status">{{ message }}</p>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
