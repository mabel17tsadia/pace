{% from "macros.html" import icon %}
<!-- Your pace today: level, 3-part bar, reasons and a quick check -->
<section class="card">
  <h2>Your pace today</h2>
  <p class="pace-level">{{ pace.level }}</p>
  <div class="pace-bar">
    {% for step in ["Gentle", "Steady", "Ready"] %}
      <div class="pace-step {% if step == pace.level %}current{% endif %}">
        <span class="pace-fill"></span>
        <span>{{ step }}</span>
      </div>
    {% endfor %}
  </div>
  <ul class="reasons">
    <li>{{ icon("moon") }} {{ pace.sleep_reason }}</li>
    <li>{{ icon("heart") }} {{ pace.heart_reason }}</li>
  </ul>
  <p>Does this feel right?</p>
  <div class="actions">
    <button type="button" class="btn-primary">Yes</button>
    <a class="text-link" href="{{ url_for('checkin') }}">Not really</a>
  </div>
</section>
