<!-- Heart rate line chart (expects "chart" from heart_chart() in app.py), with a dashed usual line -->
<svg class="chart" viewBox="0 0 600 240" role="img"
     aria-label="Heart rate from {{ chart.first }} to {{ chart.last }}, between {{ chart.min }} and {{ chart.max }} beats per minute. Your usual is {{ chart.usual }}.">
  <text x="40" y="25" text-anchor="end">{{ chart.high }}</text>
  <text x="40" y="205" text-anchor="end">{{ chart.low }}</text>
  <line class="chart-axis" x1="50" y1="200" x2="570" y2="200"/>
  <line class="chart-usual" x1="50" y1="{{ chart.usual_y }}" x2="570" y2="{{ chart.usual_y }}"/>
  <text x="570" y="{{ chart.usual_y - 8 }}" text-anchor="end">Usual {{ chart.usual }}</text>
  <polyline class="chart-line" points="{{ chart.points }}"/>
  <text x="50" y="230">{{ chart.first }}</text>
  <text x="310" y="230" text-anchor="middle">{{ chart.middle }}</text>
  <text x="570" y="230" text-anchor="end">{{ chart.last }}</text>
</svg>
