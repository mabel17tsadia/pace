{% from "macros.html" import load_tag %}
<!-- Gentle alert: a kind message about a Heavy task on a Gentle day, with four choices -->
<section class="card alert-card">
  <h2>A gentle heads-up</h2>
  <p class="task-line"><strong>{{ alert.task.title }}</strong> {{ alert.task.time }} {{ load_tag(alert.task.load) }}</p>
  <p>{{ alert.message }}</p>
  <form method="post" action="{{ url_for('alert_choice') }}" class="actions">
    <input type="hidden" name="title" value="{{ alert.task.title }}">
    <button type="submit" name="choice" value="lighter" class="btn-primary">Do a lighter task first</button>
    <button type="submit" name="choice" value="move" class="btn-secondary">Move it to tomorrow</button>
    <button type="submit" name="choice" value="keep" class="btn-secondary">Keep my plan</button>
    <button type="submit" name="choice" value="message" class="btn-secondary">Message someone I trust</button>
  </form>
</section>
